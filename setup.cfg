# Helper file for tool configs not covered by pyproject.toml.
# Build metadata, versioning (versioningit) and coverage now live in pyproject.toml.

[yapf]
# YAPF, in .style.yapf files this shows up as "[style]" header
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

[flake8]
# Flake8, PyFlakes, etc
max-line-length = 119
